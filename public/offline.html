<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d6b7a" />
    <title>غير متصل — دليل مقدمي الخدمة</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7fafb;
        --fg: #1e2d36;
        --muted: #5a6b75;
        --primary: #2d6b7a;
        --card: #ffffff;
        --border: #d7e0e5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Cairo", ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        width: min(28rem, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        text-align: center;
        box-shadow: 0 8px 24px rgb(30 45 54 / 6%);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.65rem 1.1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        افتح التطبيق مرة واحدةً وأنت متصل لتحميل الدليل، ثم يمكنك التصفح دون اتصال.
        إن كنت قد حمّلت البيانات مسبقاً، جرّب العودة إلى الدليل.
      </p>
      <a href="/providers">العودة إلى الدليل</a>
    </main>
  </body>
</html>
